spring.application.name=smartserve-backend

# -------------------------
# Database Configuration
# -------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/smartserve?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------
# JPA / Hibernate
# -------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------
# JWT Configuration
# -------------------------
app.jwt.secret=SmartServeJwtSecretKey2024XYZ!@#$%^&*()AbCdEfGhIjKlMnOpQrStUvWxYz0123456789
app.jwt.expiration=86400000

# -------------------------
# File Upload Settings
# -------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=./uploads

# -------------------------
# Server
# -------------------------
server.port=8080
