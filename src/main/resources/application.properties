spring.application.name=smartserve-backend

# -------------------------
# Database Configuration
# -------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/smartserve?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------
# JPA / Hibernate
# -------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------
# JWT Configuration
# -------------------------
app.jwt.secret=${JWT_SECRET:SmartServeJwtSecretKey2024XYZ!@#$%^&*()AbCdEfGhIjKlMnOpQrStUvWxYz0123456789}
app.jwt.expiration=86400000

# -------------------------
# File Upload Settings
# -------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=${UPLOAD_DIR:./uploads}

# -------------------------
# CORS Configuration
# -------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}

# -------------------------
# Server
# -------------------------
server.port=${PORT:8080}

